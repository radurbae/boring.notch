name: Build Custom App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Boring Notch
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.x (Swift 6.1 compatible)
        run: |
          echo "Available Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "none found at /Applications"
          # Prefer Xcode 16.x to get Swift 6.1 (tools 6.1) without Swift 6.2 strict concurrency
          XCODE16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE16" ]; then
            echo "Using Xcode 16: $XCODE16"
            sudo xcode-select -s "$XCODE16/Contents/Developer"
          else
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            echo "No Xcode 16 found, using: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build App (Ad-Hoc Signed)
        run: |
          set -o pipefail
          xcodebuild -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build 2>&1 | tee /tmp/xcodebuild.log || true

      - name: Show All Swift Errors
        if: always()
        run: |
          echo "====== SWIFT ERRORS ======"
          grep -n "error:" /tmp/xcodebuild.log | grep -v "^Binary\|_warning\|note:" || echo "(no error: lines found)"
          echo "====== BUILD STATUS ======"
          tail -30 /tmp/xcodebuild.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Fail if Build Failed
        run: |
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log || (echo "BUILD FAILED" && exit 1)

      - name: Package App into Zip
        run: |
          cd "build/Build/Products/Release"
          zip -r -y "BoringNotch-Custom.zip" "Boring Notch.app"
          mv "BoringNotch-Custom.zip" "$GITHUB_WORKSPACE/"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-Custom
          path: BoringNotch-Custom.zip
          retention-days: 14
