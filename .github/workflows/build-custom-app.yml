name: Build Custom App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Boring Notch
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null
          # Use Xcode 26.x — same as upstream project
          XCODE26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE26" ]; then
            echo "Using: $XCODE26"
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          else
            LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            echo "Xcode 26 not found, using latest: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build App (Ad-Hoc Signed)
        run: |
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            2>&1 | tee /tmp/xcodebuild.log || true

      - name: Show Swift Errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep " error:" /tmp/xcodebuild.log | grep -v "^note:" || echo "(none)"
          echo "===== LAST 20 LINES ====="
          tail -20 /tmp/xcodebuild.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Check Build Succeeded
        run: |
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log || (echo "BUILD FAILED" && exit 1)

      - name: Package App into Zip
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          cd "build/Build/Products/Release"
          zip -r -y "BoringNotch-Custom.zip" *.app
          mv "BoringNotch-Custom.zip" "$GITHUB_WORKSPACE/"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-Custom
          path: BoringNotch-Custom.zip
          retention-days: 14
