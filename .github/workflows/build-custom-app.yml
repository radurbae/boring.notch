name: Build Custom App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Boring Notch
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode (16.2+)
        run: |
          echo "Available Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app
          # Select highest available Xcode version to support Swift tools 6.1+
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selected: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch

      - name: Build App (Unsigned)
        run: |
          xcodebuild -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App into Zip
        run: |
          cd "build/Build/Products/Release"
          zip -r -y "BoringNotch-Custom.zip" "Boring Notch.app"
          mv "BoringNotch-Custom.zip" "$GITHUB_WORKSPACE/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-Custom
          path: BoringNotch-Custom.zip
          retention-days: 14
