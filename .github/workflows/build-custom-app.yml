name: Build Custom App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Boring Notch
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build App (Unsigned)
        run: |
          xcodebuild -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App into Zip
        run: |
          cd "build/Build/Products/Release"
          zip -r -y "BoringNotch-Custom.zip" "Boring Notch.app"
          mv "BoringNotch-Custom.zip" "$GITHUB_WORKSPACE/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-Custom
          path: BoringNotch-Custom.zip
          retention-days: 14
